{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil - Emisa</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

<div class="perfil-usuario-container">

    <header class="perfil-usuario-topo">

        <a href="{% url 'explorar' %}" class="voltar">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <div>
            <h1>Meu Perfil</h1>
            <span>EMISA</span>
        </div>

        <div></div>

    </header>


    <main class="perfil-usuario-conteudo">

        <section class="usuario-card">

            <div class="usuario-avatar">
                <i class="fa-solid fa-user"></i>
            </div>

            <h2>{{ usuario.first_name }}</h2>

            <p>
                <i class="fa-solid fa-envelope"></i>
                {{ usuario.email }}
            </p>

        </section>


        <section class="perfil-opcoes">

            <a
                href="{% url 'minhas_solicitacoes' %}"
                class="perfil-opcao"
            >
                <div class="perfil-opcao-icone">
                    <i class="fa-solid fa-file-signature"></i>
                </div>

                <div>
                    <strong>Minhas Solicitações</strong>
                    <span>Acompanhe suas solicitações de adoção</span>
                </div>

                <i class="fa-solid fa-chevron-right seta"></i>
            </a>


            <a
                href="{% url 'logout' %}"
                class="perfil-opcao sair-opcao"
            >
                <div class="perfil-opcao-icone">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </div>

                <div>
                    <strong>Sair da conta</strong>
                    <span>Encerrar sua sessão</span>
                </div>

                <i class="fa-solid fa-chevron-right seta"></i>
            </a>

        </section>

    </main>

</div>

</body>
</html>
